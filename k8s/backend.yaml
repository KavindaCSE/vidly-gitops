apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: kavindasamarawickkrama2001/vidly-backend:v.1
          imagePullPolicy: IfNotPresent
          command: ["./docker-entrypoint.sh"]
          ports:
            - containerPort: 3001
          env:
            - name: DB_URL
              value: mongodb://db/vidly
            - name: PORT
              value: "3001"
---
apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  type: NodePort
  selector:
    app: backend
  ports:
    - port: 3001
      targetPort: 3001
      nodePort: 30001
      protocol: TCP
